<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a3c5e" />
   
    <!-- Primary SEO -->
    <title>Nivas24 — Rooms, PG & Flats for Rent in Mohali, Chandigarh, Panchkula</title>
    <meta name="description" content="Find affordable rooms, PG accommodation, studios and flats for rent in Mohali, Chandigarh and Panchkula. Browse verified listings, contact owners directly — no registration needed." />
    <meta name="keywords" content="rooms for rent in Mohali, PG in Mohali, rooms for rent in Chandigarh, PG in Chandigarh, rooms for rent in Panchkula, flat for rent Mohali, single room rent Chandigarh, paying guest Mohali Sector 70, room rent near ISBT Chandigarh, affordable PG Panchkula, furnished room Mohali, 1BHK rent Chandigarh, studio apartment Mohali, room rent Phase 7 Mohali, room rent Sector 17 Chandigarh" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://nivas24.com/" />

    <!-- Open Graph (for WhatsApp / Facebook sharing) -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="Nivas24 — Rooms & PG for Rent in Mohali, Chandigarh, Panchkula" />
    <meta property="og:description" content="Find affordable rooms, PG, studios and flats for rent in Mohali, Chandigarh and Panchkula. Contact owners directly." />
    <meta property="og:url"         content="https://nivas24.com/" />
    <meta property="og:site_name"   content="Nivas24" />
    <meta property="og:locale"      content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Nivas24 — Rooms & PG for Rent in Mohali, Chandigarh" />
    <meta name="twitter:description" content="Browse verified room listings in Mohali, Chandigarh, Panchkula. No login needed." />

    <!-- Geo targeting -->
    <meta name="geo.region"      content="IN-PB" />
    <meta name="geo.placename"   content="Mohali, Punjab, India" />
    <meta name="geo.position"    content="30.7046;76.7179" />
    <meta name="ICBM"            content="30.7046, 76.7179" />

    <!-- Structured Data — Local Business -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "RealEstateAgent",
      "name": "Nivas24",
      "description": "Nivas24 is a property listing platform for rooms, PG, studios and flats for rent in Mohali, Chandigarh and Panchkula.",
      "url": "https://nivas24.com",
      "areaServed": [
        { "@type": "City", "name": "Mohali" },
        { "@type": "City", "name": "Chandigarh" },
        { "@type": "City", "name": "Panchkula" }
      ],
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Mohali",
        "addressRegion": "Punjab",
        "addressCountry": "IN"
      },
      "sameAs": []
    }
    </script>

    <!-- Structured Data — Website with Searchbox -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Nivas24",
      "url": "https://nivas24.com",
      "description": "Find rooms, PG and flats for rent in Mohali, Chandigarh and Panchkula",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://nivas24.com/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  </head>
  <body>

    <div id="root"></div>
  </body>
</html>
